# =============================================================================
# AI呼叫中心 CI/CD Pipeline
# GitLab Runner + SonarQube + Maven + Jib + Nexus + Harbor
# =============================================================================

stages:
  - compile
  - test
  - static-analysis
  - package
  - jib-build
  - publish

# ---------------------------------------------------------------------------
# 全局变量 — 敏感值请在 GitLab CI/CD Settings → Variables 中配置
# ---------------------------------------------------------------------------
variables:
  MAVEN_OPTS: "-Djava.awt.headless=true -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_REGISTRY: "localhost:8444"

# ---------------------------------------------------------------------------
# Maven 本地仓库缓存
# ---------------------------------------------------------------------------
cache:
  key: m2-cache
  paths:
    - .m2/repository/

# ---------------------------------------------------------------------------
# 通用模板：Maven 作业
# ---------------------------------------------------------------------------
.maven-job:
  image: maven:3.8.6-openjdk-8
  before_script:
    - echo "Maven $(mvn --version | head -1)"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------------
# Stage 1: 编译
# ---------------------------------------------------------------------------
maven-compile:
  extends: .maven-job
  stage: compile
  script:
    - mvn $MAVEN_CLI_OPTS clean compile -DskipTests
  artifacts:
    paths:
      - "*/target/classes/"
      - "*/target/generated-sources/"
    expire_in: 30min

# ---------------------------------------------------------------------------
# Stage 2: 单元测试
# ---------------------------------------------------------------------------
unit-test:
  extends: .maven-job
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/surefire-reports/"
    expire_in: 7d
  coverage: '/Total.*?([0-9]{1,3})%/'  # 可选覆盖率正则

# ---------------------------------------------------------------------------
# Stage 3: SonarQube 代码扫描
# 仅 main / develop 分支及 Merge Request 自动触发
# 需在 Settings → Variables 配置 SONAR_HOST_URL、SONAR_TOKEN
# ---------------------------------------------------------------------------
sonarqube:
  extends: .maven-job
  stage: static-analysis
  needs: ["unit-test"]
  script:
    - mvn $MAVEN_CLI_OPTS compile sonar:sonar
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
  only:
    - main
    - develop
    - merge_requests
  except:
    variables:
      - $SONAR_HOST_URL == null
      - $SONAR_TOKEN == null

# ---------------------------------------------------------------------------
# Stage 4: Maven 打包
# ---------------------------------------------------------------------------
maven-package:
  extends: .maven-job
  stage: package
  needs: ["unit-test"]
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests

# ---------------------------------------------------------------------------
# Stage 5: Jib 镜像构建 & 推送到 Harbor
# 无需 Docker Daemon，构建+推送一步完成
# ---------------------------------------------------------------------------
jib-build:
  extends: .maven-job
  stage: jib-build
  needs: ["unit-test"]
  before_script:
    - echo "Maven $(mvn --version | head -1)"
    - docker pull eclipse-temurin:8-jre 2>/dev/null || true
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
  script:
    - mvn $MAVEN_CLI_OPTS compile jib:build -pl voxai-admin,voxai-call -DsendCredentialsOverHttp=true
  only:
    - main
    - develop
    - tags
  except:
    variables:
      - $DOCKER_REGISTRY_USER == null
      - $DOCKER_REGISTRY_PASS == null

# ---------------------------------------------------------------------------
# Stage 6: Nexus 制品发布
# 使用 ci/settings.xml 中的仓库认证
# ---------------------------------------------------------------------------
nexus-deploy:
  extends: .maven-job
  stage: publish
  needs: ["unit-test"]
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests
      -DaltDeploymentRepository=nexus-releases::default::${NEXUS_URL}/repository/maven-releases/
      --settings ci/settings.xml
  only:
    - main
    - tags
  except:
    variables:
      - $NEXUS_URL == null
      - $NEXUS_USER == null
      - $NEXUS_PASSWORD == null
