spring.application.name=voxai-dialer
spring.main.web-application-type=none
# HTTP debug logging can include lease payloads. Keep it off in the worker by default.
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.http=INFO
dialer.enabled=${DIALER_ENABLED:false}
dialer.company-id=${DIALER_COMPANY_ID:0}
dialer.admin-base-url=${DIALER_ADMIN_URL:http://127.0.0.1:7100/voxai-admin}
dialer.call-base-url=${DIALER_CALL_URL:http://127.0.0.1:7200/voxai-call}
dialer.username=${DIALER_ADMIN_USER:}
dialer.password=${DIALER_ADMIN_PASSWORD:}
dialer.call-token=${DIALER_CALL_TOKEN:}
dialer.lease-seconds=120
dialer.batch-size=5
dialer.poll-millis=1000
dialer.connect-timeout-millis=1500
dialer.read-timeout-millis=5000
