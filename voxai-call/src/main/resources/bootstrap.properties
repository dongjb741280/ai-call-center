## 应用名称
spring.application.name=voxai-call
spring.application.group=cc-a
spring.instance.id=${random.int(2000,3000)}
server.port=7200
server.servlet.context-path=/voxai-call

## nacos 注册配置中心
spring.cloud.nacos.server-addr=localhost:8848
spring.cloud.nacos.username=nacos
spring.cloud.nacos.password=nacos

# 当前注册服务的注册地址(k8s部署时需要注释掉)
spring.cloud.nacos.discovery.ip=localhost
spring.cloud.nacos.config.group=${spring.application.group}
spring.cloud.nacos.config.name=${spring.application.name}
spring.cloud.nacos.discovery.metadata.appId=${spring.application.name}
spring.cloud.nacos.discovery.metadata.random=${spring.instance.id}
spring.cloud.nacos.discovery.group=${spring.application.group}
spring.cloud.nacos.discovery.enabled=true
#如果IDE使用dev环境启动，下面一行设置为false，设置Actice profile=dev
spring.cloud.nacos.config.enabled=true
spring.profiles.active=dev


#默认配置项
jasypt.encryptor.password=fs-platform
mybatis.mapper-locations=classpath:mapper/*.xml

management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/manager
management.endpoint.shutdown.enabled=true

#访问账号
spring.security.user.name=admin
spring.security.user.password=${spring.application.name}
spring.security.user.roles=ADMIN

logging.file.path=../logs
# CDR MQ: persistent messages + correlated confirms; v1 remains the default callback contract.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
cdr.notify.version=1
cdr.notify.pollMillis=5000
cdr.notify.maxAttempts=10

# External dialer is opt-in; configure a distinct >=32 character token for each permitted company.
dialer.control.enabled=false
dialer.control.company-concurrency=20
dialer.control.max-call-seconds=3600
dialer.control.max-predictive-ratio=2.0
dialer.control.max-abandon-rate=0.03
# dialer.control.tokens[1]=${DIALER_CALL_TOKEN}
# Unique snowflake IDs are required when several call-service instances generate calls.
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:0}
snowflake.datacenter-id=${SNOWFLAKE_DATACENTER_ID:0}
