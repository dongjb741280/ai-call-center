name: Portal CI

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
