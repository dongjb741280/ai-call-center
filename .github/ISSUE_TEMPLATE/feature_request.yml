name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 这个功能要解决什么问题？当前有什么痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的实现方式或交互
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他替代方案？
